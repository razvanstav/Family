name: Deploy Family Staging

on:
  push:
    branches:
      - codex/documente-design
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "artifacts/**"
      - "Memoria_Familiei_Review_v1.2/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: family-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Family
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Configure SSH
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/family.conf <<'EOF'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 5m
          EOF
          chmod 600 ~/.ssh/family.conf

      # 3. Verify SSH connection
      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -F ~/.ssh/family.conf \
            "$SERVER_USER@$SERVER_HOST" \
            'echo "SSH connection successful"'

      # 4. Synchronize source code only
      - name: Synchronize source
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          rsync -az \
            --delete \
            --delete-delay \
            --no-owner \
            --no-group \
            --no-perms \
            --omit-dir-times \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.dockerignore' \
            --exclude='/.runtime/' \
            --exclude='/.tools/' \
            --exclude='/docs/' \
            --exclude='/artifacts/' \
            --exclude='/Memoria_Familiei_Review_v1.2/' \
            --exclude='*.md' \
            --exclude='**/.env' \
            --exclude='**/.env.*' \
            --exclude='**/node_modules/' \
            --exclude='**/vendor/' \
            --exclude='backend/storage/' \
            --exclude='backend/bootstrap/cache/' \
            --exclude='backend/public/app/' \
            --exclude='frontend/dist/' \
            -e "ssh -F $HOME/.ssh/family.conf" \
            ./ \
            "$SERVER_USER@$SERVER_HOST:/srv/family/source/"

          echo "Source synchronization completed"

      # 5. Build Docker images, migrate and publish
      - name: Build and deploy on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -F ~/.ssh/family.conf \
            "$SERVER_USER@$SERVER_HOST" \
            'sudo -n /srv/family/deploy/deploy.sh'

          echo "Docker deployment completed"

      # 6. Verify Laravel and React directly in Docker
      - name: Verify application on server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -F ~/.ssh/family.conf \
            "$SERVER_USER@$SERVER_HOST" \
            'set -eu
             for path in /up /app/; do
               code=$(curl \
                 --silent \
                 --show-error \
                 --connect-timeout 10 \
                 --max-time 30 \
                 --output /dev/null \
                 --write-out "%{http_code}" \
                 "http://127.0.0.1:8085${path}")

               echo "Local ${path}: HTTP ${code}"
               test "$code" = "200" || exit 1
             done'

      # 7. Verify HTTPS directly through Apache, bypassing Cloudflare
      - name: Verify HTTPS directly on origin
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -F ~/.ssh/family.conf \
            "$SERVER_USER@$SERVER_HOST" \
            'set -eu

             for path in /up /app/; do
               echo "Checking HTTPS origin: $path"

               curl \
                 --resolve family.meai.ro:443:127.0.0.1 \
                 --fail \
                 --silent \
                 --show-error \
                 --connect-timeout 10 \
                 --max-time 30 \
                 --output /dev/null \
                 --write-out "HTTP %{http_code}\n" \
                 "https://family.meai.ro${path}"
             done'

          echo "HTTPS origin verification successful"

      # 8. Deployment completed
      - name: Deployment completed
        run: |
          echo "===================================="
          echo " Family Staging - DEPLOY SUCCESS"
          echo "===================================="
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "URL: https://family.meai.ro/app/"

      - name: Close SSH connection
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          if [ -f ~/.ssh/family.conf ]; then
            ssh -F ~/.ssh/family.conf -O exit "$SERVER_USER@$SERVER_HOST" 2>/dev/null || true
          fi
          rm -f ~/.ssh/id_ed25519 ~/.ssh/family.conf ~/.ssh/cm-*
