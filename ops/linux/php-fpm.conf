; Dedicated pool. Adapt socket ownership to the installed Nginx user/group.
[memoria]
user = memoria
group = memoria
listen = /run/php/memoria.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Tune this limit after measuring available RAM alongside PostgreSQL/ClamAV.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 120s
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/memoria/shared/storage/logs/php-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
