# Adapt domain, certificate paths and the Nginx socket user before installing.
server {
    listen 80;
    server_name family.example.com;
    return 301 https://family.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name family.example.com;

    ssl_certificate /etc/letsencrypt/live/family.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/memoria/current/backend/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 12m;

    location = /app {
        return 301 /app/;
    }

    # Keep the HTML response and its security/cache headers in Laravel.
    location /app/ {
        rewrite ^ /index.php last;
    }

    location ^~ /app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/memoria.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /storage/ {
        return 404;
    }
}
